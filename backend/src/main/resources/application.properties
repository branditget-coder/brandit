# ================================
# BrandIt Backend Configuration
# ================================

spring.application.name=brandit-backend
server.port=${PORT:8080}

# --------------------------------
# Database (PostgreSQL with H2 dev fallback)
# --------------------------------
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:branditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}}
spring.datasource.driver-class-name=${DATABASE_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------
# File Upload Limits (for PDF/DOCX Resumes)
# --------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --------------------------------
# Google OAuth 2.0
# --------------------------------
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id_placeholder}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_placeholder}

# --------------------------------
# JWT
# --------------------------------
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForBrandItJwtTokenMinimum256BitLengthRequired2024}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# --------------------------------
# Mail (Resend via SMTP)
# --------------------------------
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:re_placeholder_key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=hello@brandit.in

# --------------------------------
# Stripe
# --------------------------------
stripe.api.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# --------------------------------
# Razorpay
# --------------------------------
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}

# --------------------------------
# Groq AI
# --------------------------------
groq.api.key=${GROQ_API_KEY:gsk_placeholder}
groq.base.url=https://api.groq.com/openai/v1
groq.model=llama-3.1-70b-versatile

# --------------------------------
# AWS S3
# --------------------------------
aws.s3.bucket=${AWS_S3_BUCKET:brandit-uploads}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.access.key=${AWS_ACCESS_KEY:placeholder}
aws.secret.key=${AWS_SECRET_KEY:placeholder}

# --------------------------------
# CORS
# --------------------------------
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://brandit.vercel.app}

# --------------------------------
# Swagger
# --------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --------------------------------
# Logging
# --------------------------------
logging.level.com.brandit=DEBUG
logging.level.org.springframework.security=WARN
