# ================================
# BrandIt Backend Configuration
# ================================

spring.application.name=brandit-backend
server.port=${PORT:8080}

# --------------------------------
# Database
# NOTE: Spring datasource URL is intentionally NOT set here.
# DatabaseConfig.java reads DATABASE_URL env var and handles
# the jdbc:postgresql:// conversion automatically.
# Local dev falls back to H2 in-memory via DatabaseConfig.
# --------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true
# --------------------------------
# File Upload Limits (for PDF/DOCX Resumes)
# --------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --------------------------------
# JWT
# --------------------------------
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForBrandItJwtTokenMinimum256BitLengthRequired2024}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# --------------------------------
# Mail (Gmail SMTP Default)
# --------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:brandit.get@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:${RESEND_API_KEY:placeholder_password}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:brandit.get@gmail.com}

# --------------------------------
# Stripe
# --------------------------------
stripe.api.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# --------------------------------
# Razorpay
# --------------------------------
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}

# --------------------------------
# Groq AI
# --------------------------------
groq.api.key=${GROQ_API_KEY:gsk_placeholder}
groq.base.url=https://api.groq.com/openai/v1
groq.model=llama-3.1-70b-versatile

# --------------------------------
# AWS S3
# --------------------------------
aws.s3.bucket=${AWS_S3_BUCKET:brandit-uploads}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.access.key=${AWS_ACCESS_KEY:placeholder}
aws.secret.key=${AWS_SECRET_KEY:placeholder}

# --------------------------------
# CORS — allow all Vercel preview & production domains
# --------------------------------
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://brandit.vercel.app,https://brandit-eta.vercel.app}

# --------------------------------
# Swagger
# --------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --------------------------------
# Logging
# --------------------------------
logging.level.com.brandit=DEBUG
logging.level.org.springframework.security=WARN
