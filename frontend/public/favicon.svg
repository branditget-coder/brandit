<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="branditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2" />
      <stop offset="100%" stop-color="#004182" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A66C2" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="128" fill="url(#branditGrad)" />
  
  <!-- Sleek BrandIt Bi Emblem -->
  <g filter="url(#glow)">
    <!-- Letter B in Pure Crisp White -->
    <text x="100" y="375" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="340" fill="#FFFFFF" letter-spacing="-10">B</text>
    <!-- Dot & Stem of 'i' in Sky Blue -->
    <text x="335" y="375" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="340" fill="#60A5FA" letter-spacing="-10">i</text>
  </g>
</svg>