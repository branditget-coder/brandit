    <!-- JSON-LD Structured Data: Organization & ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "BrandIt",
        "url": "https://go-brandit.vercel.app",
        "logo": "https://go-brandit.vercel.app/logo.png",

        "description": "Professional LinkedIn branding and executive network growth engine. Profile overhauls, strategic monthly content, and cold outreach campaigns.",
        "priceRange": "₹99 - ₹400",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "LinkedIn Personal Branding Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Profile Setup & Account Building Advice",
                "description": "Complete LinkedIn profile overhaul, high-impact banner alignment, headline optimization, and tailored growth blueprint."
              },
              "price": "99",

            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Profile Setup + Personal Branding",
                "description": "Full profile setup combined with 8 strategy-backed posts/month to consistently build industry authority."
              },
              "price": "320",
              "priceCurrency": "INR"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Branding + Network Growth Engine",
                "description": "Full profile setup, 8 monthly strategy posts, plus cold messaging, targeted outreach, and follow-up management."

            }
          ]
