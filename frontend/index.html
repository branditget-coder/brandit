    <!-- Primary High-CTR SEO Metadata -->
    <title>BrandIt | LinkedIn Personal Branding &amp; Growth Engine</title>

    <!-- JSON-LD Structured Data: WebSite (For Google Search Site Name Disambiguation) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BrandIt",
        "alternateName": ["BrandIt LinkedIn Branding", "BrandIt App", "go-brandit"],
        "url": "https://go-brandit.vercel.app/"
      }
    </script>

          },
          {

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "url": "https://go-brandit.vercel.app",
